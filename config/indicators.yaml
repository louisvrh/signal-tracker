  # ------------------------------------------------ Official industrial production
  - id: eurostat_ip
    source: eurostat
    name: Industrial production index (Eurostat)
    description: Volume of production, industry excluding construction (NACE B-D), seasonally and calendar adjusted, 2021=100 (Eurostat sts_inpr_m).
    unit: index 2021=100
    frequency: M
    category: official
    role: official
    higher_is_stronger: true
    default_transform: yoy_m
    seasonality: []
    publication_lag_days: 47
    refetch_window_days: 730
    countries: [DEU, FRA, ITA, ESP, NLD, POL]
    notes: Target for H2/E2 in EU countries. Eurostat publishes about 45 days after the month; national offices (e.g. Destatis) are a week or so earlier. No real-time vintages via the API, so history is estimated.

  - id: oecd_ip
    source: oecd
    name: Industrial production index (OECD)
    description: Production volume index, industry excluding construction (BTE), seasonally adjusted, 2015=100 (OECD DF_INDSERV).
    unit: index 2015=100
    frequency: M
    category: official
    role: official
    higher_is_stronger: true
    default_transform: yoy_m
    seasonality: []
    publication_lag_days: 75
    refetch_window_days: 730
    countries: [CAN, MEX, BRA, GBR, TUR, IND, JPN, KOR]
    notes: OECD republishes national data, so it lags the national release by a few weeks. USA uses fred_indpro (with real vintages) instead.

  - id: oecd_ip_manufacturing
    source: oecd
    name: Manufacturing production index (OECD)
    description: Production volume index, manufacturing (ISIC C), seasonally adjusted, 2015=100 (OECD DF_INDSERV).
    unit: index 2015=100
    frequency: M
    category: official
    role: official
    higher_is_stronger: true
    default_transform: yoy_m
    seasonality: []
    publication_lag_days: 200
    refetch_window_days: 730
    countries: [IDN, ZAF]
    notes: Indonesia and South Africa have no total-industry index at the OECD. Latest month on 2026-09-27 was March 2026 for IDN (the 200-day lag) and June 2026 for ZAF (75 days, sources.yaml).

  # ------------------------------------------------------------ Open-Meteo
  - id: openmeteo_temp_mean
    source: openmeteo
    name: Population-weighted mean temperature
    description: Daily mean 2 m temperature of the country's weather cities (local-time days), weighted by population (Open-Meteo archive, ERA5).
    unit: degC
    frequency: D
    category: weather
    role: control
    higher_is_stronger: true
    default_transform: level
    seasonality: [annual]
    publication_lag_days: 1
    refetch_window_days: 30
    countries: watchlist
    notes: Control variable for weather-normalised power demand (S18). The last ~5 days come from a preliminary model and are revised.

  - id: openmeteo_hdd18
    source: openmeteo
    name: Heating degree days (base 18 C)
    description: Population-weighted sum over cities of max(0, 18 - daily mean temperature).
    unit: degC days
    frequency: D
    category: weather
    role: control
    higher_is_stronger: true
    default_transform: level
    seasonality: [annual]
    publication_lag_days: 1
    refetch_window_days: 30
    countries: watchlist
    notes: Computed per city, then weighted.

  - id: openmeteo_cdd22
    source: openmeteo
    name: Cooling degree days (base 22 C)
    description: Population-weighted sum over cities of max(0, daily mean temperature - 22).
    unit: degC days
    frequency: D
    category: weather
    role: control
    higher_is_stronger: true
    default_transform: level
    seasonality: [annual]
    publication_lag_days: 1
    refetch_window_days: 30
    countries: watchlist
    notes: Computed per city, then weighted.

