# Country reference (PLAN §4.4). The watchlist is every country listed here.
#
# Fields
#   iso3, name        ISO 3166-1 alpha-3 code and English name
#   un_m49            UN M49 numeric code
#   comtrade_code     Comtrade reporter code, only where it differs from un_m49
#                     (checked against Comtrade's reporter reference on 2026-09-27)
#   entsoe_code       entsoe-py area code, European countries only
#   timezone          IANA zone used for local-time day boundaries (e.g. overnight load)
#   weather_cities    3-5 largest cities; weight = share of approximate metropolitan
#                     population among the listed cities (sums to 1)
#   country_etf       US-listed country ETF (tradability caveats: PLAN §5.7)
#   fx_pair           USD<CCY>: units of local currency per US dollar (null for USA)
#   holiday_calendar  country code in the `holidays` package
#   moving_holidays   any of lunar_new_year, ramadan_eid, easter, diwali, golden_week (PLAN §5.2)
#   exclude_from_signals  signal groups whose indicators this country's signals must not
#                     use (the data is still fetched and stored); currently only
#                     power_demand and power_generation (PLAN D22). Optional, default none.
#
# Values were filled in from general knowledge on 2026-09-27; lines marked `# verify`
# are the least certain. Population weights are approximate throughout.
# City coordinates were checked against the Open-Meteo geocoding API on 2026-09-27:
# all are within 10 km of the geocoded city (most within 2 km).

countries:
