# Shipping chokepoints (country code CHK_<NAME>). portwatch_id is the `portid`
# in IMF PortWatch's Daily_Chokepoints_Data layer (checked 2026-09-27).
chokepoints:
  - {code: CHK_SUEZ, name: Suez Canal, portwatch_id: chokepoint1}
  - {code: CHK_PANAMA, name: Panama Canal, portwatch_id: chokepoint2}
  - {code: CHK_BOSPORUS, name: Bosporus Strait, portwatch_id: chokepoint3}
  - {code: CHK_BAB_EL_MANDEB, name: Bab el-Mandeb Strait, portwatch_id: chokepoint4}
  - {code: CHK_MALACCA, name: Malacca Strait, portwatch_id: chokepoint5}
  - {code: CHK_HORMUZ, name: Strait of Hormuz, portwatch_id: chokepoint6}
  - {code: CHK_CAPE_GOOD_HOPE, name: Cape of Good Hope, portwatch_id: chokepoint7}
  - {code: CHK_GIBRALTAR, name: Gibraltar Strait, portwatch_id: chokepoint8}
